name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run build

      - name: Run tests
        run: pnpm run test --runInBand

      - name: Compile installable CLI
        run: pnpm run compile

      - name: Synthesize both targets from clean examples
        run: |
          node build/cli.js synth --config examples/compose/groma.yaml --out dist/compose
          node build/cli.js synth --config examples/kubernetes/groma.yaml --out dist/kubernetes

      - name: Exercise two isolated Compose applications
        run: pnpm run test:integration

      - name: Verify package contents
        run: npm pack --ignore-scripts --dry-run
