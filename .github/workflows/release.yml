name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # ── Step 1: Release Please ──────────────────────────────────────────────────
  # Reads conventional commits since the last release, bumps the version in
  # package.json, updates CHANGELOG.md, and opens a "Release PR".
  # When that PR is merged it creates the GitHub Release + tag.
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      upload_url: ${{ steps.release.outputs.upload_url }}

    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: node

  # ── Step 2: Build & attach manifests on actual release ─────────────────────
  # Runs only when the Release PR is merged (i.e. a real release is cut).
  # Synthesises Kubernetes manifests for the environments that have a complete
  # config in the repo (currently: local, dev).  Staging and prod require
  # secrets / cluster-specific values that callers must supply themselves — see
  # README § "Config templates" and § "Manifest History / GitOps Strategy".
  build-release-assets:
    name: Build & Attach Release Assets
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run build

      - name: Run tests
        run: pnpm run test

      # Synthesise manifests for every environment that ships a complete config
      # template in config/.  Environments without a devenv.yaml or full env
      # file are skipped gracefully.
      - name: Synthesise manifests
        id: synth
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          echo "Synthesising manifests for release $TAG"
          mkdir -p release-assets

          for env in local dev staging prod; do
            echo "→ $env"
            if APP_ENV=$env pnpm run synth 2>/dev/null; then
              tar -czf "release-assets/manifests-${env}.tar.gz" dist/
              echo "  ✓ manifests-${env}.tar.gz created"
            else
              echo "  ⚠ Skipped $env (config incomplete — expected for staging/prod in CI)"
            fi
          done

          # Bundle all successfully generated sets together
          if compgen -G "release-assets/manifests-*.tar.gz" > /dev/null; then
            tar -czf "release-assets/manifests-all.tar.gz" -C release-assets \
              $(ls release-assets/*.tar.gz | xargs -n1 basename)
            echo "synth_succeeded=true" >> "$GITHUB_OUTPUT"
          else
            echo "synth_succeeded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload manifest archives to release
        if: ${{ steps.synth.outputs.synth_succeeded == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          for archive in release-assets/*.tar.gz; do
            echo "Uploading $archive …"
            gh release upload "$TAG" "$archive" --clobber
          done
